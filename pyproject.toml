[project]
name = "cost-anomaly"
version = "0.1.0"
description = "Detect daily per-service AWS cost spikes from Cost Explorer"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.scripts]
cost-anomaly = "cost_anomaly.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
